name: proofboard-mcp kiadás (npm)

# Indítás: `git tag mcp-v0.1.0 && git push origin mcp-v0.1.0` (a verzió egyezzen az mcp/package.json-nal).
# Kell hozzá az NPM_TOKEN titok (npm „Automation” token) a repó beállításaiban.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit/mcp.test.ts tests/unit/agent.test.ts
      - run: npm run build:mcp
      - name: Verzió ellenőrzése
        if: startsWith(github.ref, 'refs/tags/')
        run: test "mcp-v$(node -p "require('./mcp/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
