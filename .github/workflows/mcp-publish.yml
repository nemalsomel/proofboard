name: proofboard-mcp kiadás (npm)

# Indítás: az mcp/package.json verziójának emelése után `git tag mcp-vX.Y.Z` + push (a tag egyezzen a verzióval),
# vagy az Actions fülön „Run workflow” (ekkor a verzió az mcp/package.json-ból).
# Token nélkül, npm Trusted Publishing (OIDC) – egyszeri beállítás az npmjs.com-on: a proofboard-mcp csomag
# Settings › Trusted Publisher › GitHub Actions: nemalsomel / proofboard, munkafolyamat: mcp-publish.yml.
# (Az első kiadás kézzel, 2FA-val: `npm run build:mcp && cd mcp && npm publish --access public`.)
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit/mcp.test.ts tests/unit/agent.test.ts
      - run: npm run build:mcp
      - name: Verzió ellenőrzése
        if: startsWith(github.ref, 'refs/tags/')
        run: test "mcp-v$(node -p "require('./mcp/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: npm 11.5.1+ (Trusted Publishing)
        run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: mcp
